  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;

  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}

.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}

.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}

.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

><div><b>Contorno oscuro</b><span>la pieza que trabaja en este instante</span></div></li></ul></section><section class="lg-box lg-cast"><h3>Reparto: cada pieza y lo que representa</h3><details style="--c:#f1e3cc"><summary><span class="n">1</span>Datos<span class="q">De dónde sale el texto</span></summary><dl>
<dt>Cajas de fuentes</dt><dd>Cada una es un origen de texto: web pública, libros y artículos, código, datos con licencia y datos sintéticos.</dd>
<dt>Embudo y tres cribas</dt><dd>Los filtros: calidad (amarilla), duplicados (celeste) y privacidad y seguridad (coral).</dd>
<dt>Cubo</dt><dd>Lo descartado. Suele ser una parte grande de lo recolectado.</dd>
<dt>Tolva y hojas</dt><dd>El texto limpio, ya cortado en tokens y barajado, listo para entrenar.</dd></dl></details><details style="--c:#fde0cc"><summary><span class="n">2</span>Preentrenar<span class="q">Aprender a predecir</span></summary><dl>
<dt>Canaleta de 12 casillas</dt><dd>La ventana de contexto: cada tipo metálico es un token.</dd>
<dt>Torre de 6 bandejas</dt><dd>Las capas del transformer. Cada una tiene una zona de atención y otra de red neuronal.</dd>
<dt>Elevador y cuentas</dt><dd>El vector del token que se está procesando, subiendo de capa en capa.</dd>
<dt>Ruleta (modo entrenamiento)</dt><dd>No sortea: señala la palabra real, y su porción es la probabilidad que el modelo le daba.</dd>
<dt>Panel, aguja y gráfica</dt><dd>La pérdida de cada ejemplo y su curva a lo largo del entrenamiento.</dd>
<dt>Perillas y arcos coral</dt><dd>Los pesos y el gradiente: cuánto y hacia dónde gira cada uno.</dd>
<dt>Contador y cinco luces</dt><dd>Tokens leídos y habilidades que van apareciendo (ilustrativo).</dd></dl></details><details style="--c:#fbd7e5"><summary><span class="n">3</span>Ajustar<span class="q">Convertirse en asistente</span></summary><dl>
<dt>Teclado</dt><dd>Personas escribiendo respuestas ejemplares (ajuste supervisado).</dd>

      forward(push, b.toks.length, null, false, first ? `<b>Predice.</b> El texto sube por las 6 capas, exactamente igual que cuando responde. Pregunta: ¿qué palabra viene ahora? (Al entrenar se procesan millones de estos ejemplos a la vez, en paralelo.)` : null);
      push(0.01, () => step(2));
      showCands(push, b.cands, b.probs, b.truth, false, first
        ? `<b>Compara.</b> Al entrenar la ruleta no se juega: sólo gira despacio hasta que el puntero señala la palabra real, ${tok(b.cands[b.truth], "y")}. Su porción del círculo es lo que el modelo le daba: ${pct(b.probs[b.truth])}. Las otras porciones son las palabras en las que se equivocaba.`
        : `<b>Compara.</b> La ruleta va directa a la palabra real, ${tok(b.cands[b.truth], "y")}. Fíjate en su porción: ya ocupa ${pct(b.probs[b.truth])} del círculo.`, { train: true });
      push(first ? 2.07 : 1.2, () => {
        to("meter", Math.min(1, b.loss / 3), 0.6); look("panel");
        const from = prevStep; plotTo(from, b.step); prevStep = b.step;
        narr(`<b>Compara.</b> La palabra real era ${tok(b.cands[b.truth], "y")} y el modelo le daba ${pct(b.probs[b.truth])}. La <b>pérdida</b> = −ln(${dec(b.probs[b.truth])}) = <b>${dec(b.loss)}</b>: ${first ? "aguja del panel y punto coral en la gráfica. Si hubiera dado 100 %, la pérdida sería 0; cuanto más baja, mejor." : "la aguja marca menos que antes."}`, first ? 1 : 0.6);
        say(`pérdida ${dec(b.loss)}`);
      });

      backprop(push, first, Math.min(1.2, b.loss / 2), bi, first ? null : `<b>Retropropaga.</b> El error baja por las capas y cada una gira sus perillas, ahora menos: el error es menor.`);
      push(first ? 2.07 : 1.2, () => {

          : `<b>Ajusta pesos.</b> Tras ${fmt(b.step)} pasos, ${tok(b.cands[b.truth], "y")} ya recibe ${pct(b.probs[b.truth])}. La curva de la gráfica sigue bajando.`, first ? 1 : 0.7);

          : `<b>Progreso.</b> ${tokensB >= 1000 ? dec(tokensB / 1000, 1) + " billones (millones de millones)" : fmt(Math.round(tokensB)) + " mil millones"} de tokens leídos. Luces encendidas: ${names.slice(0, n).join(", ")}.${n === 5 ? " (Ilustrativo: las capacidades reales emergen de forma gradual y desigual.)" : ""}`, first ? 1 : 0.8);
      });
    });
    push(0.1, () => { step(6); sfx.done(); look("all"); narr(`<b>Esto se repite cientos de miles de veces</b>, cada paso con millones de tokens a la vez: billones de tokens en total, en miles de chips durante meses. Sin que nadie le programe reglas, el modelo aprende gramática, hechos del mundo y formas de razonar, sólo intentando adivinar la palabra siguiente. (Curva ilustrativa.)`); });
  } else if (kind === "tune") {

        : `<b>Respuesta B.</b> Misma petición, otra tirada de la ruleta: esta vez sale una respuesta distinta. Ya hay dos candidatas para comparar.`, ai === 0 ? 1 : 0.7); });
      ans.toks.forEach((t, j) => { const pos = TUNE.prompt.length + j; push(0.28, () => to("head", pos)); cast(push, pos, "gen", t, false, null); });

    push(1, () => { narr(`<b>Personas votan.</b> 8 prefieren B y 2 prefieren A. Con miles de votaciones como esta se entrena otro modelo: el <b>juez</b>, o modelo de recompensa.`, 0.8); say("B 8 · A 2"); });
    // 4 · the judge, guided by written principles

    push(1.6, () => {

      narr(`<b>Balanza.</b> La balanza baja hacia B: es la respuesta preferida (+0,72 frente a −0,35). Comparar respuestas es más fiable que puntuar una sola.`);

    push(2.07, () => {
      winner = 1;

    });
    push(2.25, () => {
      to("bar0", TUNE.after[0], 0.6); to("bar1", TUNE.after[1], 0.6); setTimeoutish(() => look("reward"), 2.2);
      plot = [];
      for (let j = 0; j <= 24; j++) { const u = j / 24; plot.push([u, Math.max(0, Math.min(1, 0.36 + 0.42 * (1 - Math.exp(-u * 3)) + (hash(j, 3, 9) - 0.5) * 0.08))]); }
      narr(`<b>…y después:</b> ${tok(" No", "y")} baja a ${pct(TUNE.after[0])} y ${tok(" Trata", "y")} sube a ${pct(TUNE.after[1])}. Repetido con millones de peticiones, la <b>recompensa media sube</b> en la gráfica coral.`);

    });
    push(0.1, () => { step(6); sfx.done(); look("all"); narr(`<b>Así aprende a ser un asistente:</b> útil, honesto y cuidadoso, a seguir instrucciones, a razonar paso a paso y a usar herramientas. Con tareas verificables (código que debe pasar pruebas, problemas de matemáticas), el refuerzo también le enseña a resolver problemas difíciles.`); });
  } else if (kind === "ask") {
    const plan = ASK;
    push(0.6, () => { step(0); instrEl?.setAttribute("data-lit", ""); setTimeoutish(() => instrEl?.removeAttribute("data-lit"), 3); narr(`<b>Escribes una pregunta.</b> Antes de tu texto va siempre la <b>tarjeta de instrucciones</b> (el mensaje de sistema) que dice al modelo quién es y cómo comportarse. La cinta del teclado pasa por la <b>guillotina</b>, que la corta en <b>tokens</b>: palabras frecuentes enteras, y las raras en trozos (${tok(" lin")} + ${tok("otipia")}). Cada token ocupa una casilla de la canaleta: la <b>ventana de contexto</b>.`); say("tu mensaje"); });
    plan.prompt.forEach((t, i) => placeDrop(push, i, "prompt", t, 0.55, [2, 7, 11, 4, 13, 9][i % 6]));
    push(1.2, () => {});
    let pos = plan.prompt.length;
    plan.gen.forEach((g, gi) => {
      const here = pos, slow = gi === 0;

      forward(push, here, g.focus, slow, slow

        : gi === 1
          ? `<b>Otra vez, para el token ${here + 1}.</b> El mismo viaje por las 6 capas, ahora con ${tok(plan.gen[gi - 1].cands[0], "m")} en el contexto. Lo verás más rápido, y no es sólo por abreviar: los cálculos de los tokens anteriores quedan guardados (la <b>caché KV</b>), así que sólo el token nuevo hace el viaje entero. En un modelo real cada viaje dura milisegundos.`
          : `<b>Token ${here + 1}:</b> otra vez por las 6 capas, con ${tok(plan.gen[gi - 1].cands[0], "m")} ya en el contexto.`);
      showCands(push, g.cands, probs, 0, slow, slow ? null : `<b>Probabilidades:</b> ${g.cands.slice(0, 3).map((c, i) => `${tok(c, "y")} ${pct(probs[i])}`).join(" · ")}…`);
      cast(push, here, "gen", g.cands[0], slow, slow
        ? `<b>Elige y repite.</b> La ruleta se detuvo en ${tok(g.cands[0], "m")}. Se funde como un tipo nuevo, verde, en la caja de fundición y entra al contexto. Ahora <b>todo se repite</b> para la palabra siguiente.`

    });

      step(5); setLit(null); sfx.done(); look("all"); for (let i = 0; i < 5; i++) to("bar" + i, 0); to("head", pos);
      narr(`<b>Respuesta completa:</b> ${tok(plan.gen.map((g) => g.cands[0]).join(""), "m")} Un viaje completo por todas las capas por cada token. Termina cuando la ruleta saca un token especial de <b>fin de turno</b>. Los pesos no cambiaron: el modelo no aprende de tu conversación, sólo la lee.`);
      say(`${pos} tokens · pesos sin cambios`);

    push(2.07, () => {
      step(0);
      narr(`<b>Pregunta:</b> «${plan.question}» (aquí abreviada en 3 tokens). El modelo no tiene estas fechas seguras en sus pesos y la resta exige precisión.`);
      say("tu mensaje");
    });

          ? `<b>Elige herramienta.</b> Ahora el token más probable no es una palabra, sino una llamada: ${g.cands.slice(0, 4).map((c, i) => `${tok(c, "s")} ${pct(probs[i])}`).join(" · ")}.`
          : `<b>Elige herramienta.</b> Con el pensamiento delante, cambia la ganadora: ${g.cands.slice(0, 3).map((c, i) => `${tok(c, "s")} ${pct(probs[i])}`).join(" · ")}.`);
        push(1.62, () => {});
        cast(push, here, "call", g.text, false, `<b>Elige herramienta.</b> La llamada lleva nombre y <b>argumentos</b> en formato estructurado:<br><span class="tok s">${g.args}</span><br>El modelo se detiene y espera.`);
        push(1.98, () => {});
        pos++;
        const at = pos;
        push(1.4, () => {
          step(3); to("act", 0.1); to("plugz", 1); to("plugx", g.tool); look("switchboard");
          narr(firstCall
            ? `<b>Ejecuta.</b> No lo hace el modelo: el <b>orquestador</b>, el programa que lo rodea, lee la llamada y comprueba que sea válida. En la <b>centralita</b> de delante, la clavija viaja hasta la toma de esa herramienta y se enchufa.`
            : `<b>Ejecuta.</b> La clavija salta a otra toma: la de ejecutar código. El orquestador vuelve a validar la llamada antes de lanzarla.`);
          say(`orquestador · conectando ${g.text}`);
        });
        push(0.5, () => { to("plugz", 0); sfx.plug(); jackEls.forEach((el, i) => (i === g.tool ? el.setAttribute("data-on", "") : el.removeAttribute("data-on"))); });
        push(2.07, () => {
          to("tool" + g.tool, 1); sfx.hiss(); look("cabinet"); setLit("tool" + g.tool); toolLampEls.forEach((el, i) => (i === g.tool ? el.setAttribute("data-on", "") : el.removeAttribute("data-on")));
          narr(`<b>Ejecuta.</b> Del armario celeste sube la herramienta: ${["la lupa (buscar en la web)", "la terminal (ejecutar código)", "las hojas (leer archivos)", "la pantalla (usar un ordenador)"][g.tool]}. El orquestador ${g.say}. Mientras tanto <b>el modelo no calcula nada</b>: el motor y el ventilador bajan de vueltas, sólo espera.`);
          say(`ejecutando ${g.text}`);
        });
        push(0.8, () => { to("tool" + g.tool, 0); setLit(null); to("act", 0.4); toolLampEls.forEach((el) => el.removeAttribute("data-on")); jackEls.forEach((el) => el.removeAttribute("data-on")); });
        push(0.01, () => step(4));
        cast(push, at, "tool", g.result, false, `<b>Lee el resultado.</b> Lo que devuelve la herramienta, ${tok(g.result, "s")}, entra al contexto como tokens nuevos, celestes. Para el modelo es texto como cualquier otro: lo leerá con atención.`);
        push(1.8, () => {});
        ranTools++;
        pos++;
        return;
      } else {
        const firstAns = g.text === " 355";
        forward(push, here, g.focus, false, firstAns ? `<b>Responde.</b> Para escribir el número, la atención apunta directamente al resultado del código: mira la aguja más alta.` : null);
        if (firstAns) push(1.35, () => step(6));
        showCands(push, g.cands, probs, 0, false, `<b>Responde:</b> ${g.cands.slice(0, 3).map((c, i) => `${tok(c, "y")} ${pct(probs[i])}`).join(" · ")}…`);
        cast(push, here, "gen", g.text, false, null);
      }
      pos++;
    });
    push(0.2, () => {
      step(7); setLit(null); sfx.done(); look("all"); for (let i = 0; i < 5; i++) to("bar" + i, 0); to("head", Math.min(pos, C.SLOTS - 1));
      narr(`<b>Respuesta: 355 días.</b> Pensar, elegir herramienta, ejecutar, leer, volver a pensar. Trabajando como agente (por ejemplo en Claude Code), los modelos Claude repiten este ciclo cientos de veces, lanzan varias herramientas en paralelo, reparten trabajo entre <b>subagentes</b>, comprueban sus propios resultados y corrigen errores, y <b>resumen el contexto</b> cuando se llena para seguir trabajando durante horas.`);
      say("tarea completada");
    });
  }
  return list;
}

function startStage(n, user, noFF) {
  stageNow = (n + 6) % 6;
  beats = buildStage(stageNow); beat = 0; beatLeft = 0; holdLeft = 0; finished = false; paused = 0; timers = []; lastNarr = "";
  buttons.forEach((b, i) => b.setAttribute("aria-pressed", String(i === stageNow)));
  sayEl.innerHTML = SAY[stageNow];
  docStart(stageNow, user);
  if (still.matches && !noFF) fastForward();
  run();
}
function jumpToStep(k) {
  touring = true;
  startStage(stageNow, true, true);
  while (beat < beats.length && !(stepNow >= k)) { beats[beat].run(); for (const t of timers) t.fn(); timers = []; beat++; }
  beatLeft = beat > 0 ? beats[beat - 1].d : 0; holdLeft = readTime(lastNarr || "");
  WHEEL.t = WHEEL.dur; WHEEL.a = WHEEL.to;
  for (const key in A) { A[key].v = A[key].t; if (A[key].k) A[key].vel = 0; }
  arcs.forEach((a) => (a.p = 1)); plotShown = plot.length;
  stepCam(0, true);
  draw(true); if (still.matches) { finished = true; beat = beats.length; } run();
}
stepsEl.addEventListener("click", (e) => { const b = e.target.closest("[data-step]"); if (b) jumpToStep(Number(b.dataset.step)); });
function fastForward() {
  for (const b of beats) { b.run(); for (const t of timers) t.fn(); timers = []; }
  for (const key in A) { A[key].v = A[key].t; if (A[key].k) A[key].vel = 0; }
  WHEEL.t = WHEEL.dur; WHEEL.a = WHEEL.to; plotShown = plot.length;
  beat = beats.length; finished = true; draw(true);
}

// ---------------- loop ----------------
let frame = 0, last = 0, visible = false, touring = true;
let SPEED = 1, pausedUser = false, WAIT_READ = true;
function tick(now) {
  const raw = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const dt = pausedUser ? 0 : raw * SPEED;
  if (!still.matches && !pausedUser) {
    beatLeft -= dt; holdLeft -= dt;
    while (beatLeft <= 0 && beat < beats.length && (holdLeft <= 0 || !WAIT_READ || !beats[beat].talks)) { beats[beat].run(); beatLeft += beats[beat].d; beat++; }
    stepWheel(dt);
    if (beat >= beats.length && beatLeft <= 0 && (holdLeft <= 0 || !WAIT_READ) && !finished) { finished = true; paused = docEnd(); }
    if (finished && touring) { paused -= dt; if (paused <= 0) startStage(stageNow + 1); }
    timers = timers.filter((t) => { t.left -= dt; if (t.left <= 0) { t.fn(); return false; } return true; });
    for (const key in A) {
      const a = A[key];
      if (a.k) {
        const h = dt / 4;
        for (let s = 0; s < 4; s++) {
          a.vel += (a.k * (a.t - a.v) - a.c * a.vel) * h; a.v += a.vel * h;
          if (a.floor != null && a.v < a.floor) { if (Math.abs(a.vel) > 25) sfx.clink(Math.min(1, Math.abs(a.vel) / 110)); a.v = a.floor; a.vel = -a.vel * 0.32; }
        }
        if (Math.abs(a.t - a.v) < 0.0008 && Math.abs(a.vel) < 0.004) { a.v = a.t; a.vel = 0; }
      } else { a.v += (a.t - a.v) * (1 - Math.exp(-dt / Math.max(0.01, a.tau))); if (Math.abs(a.t - a.v) < 0.0005) a.v = a.t; }
    }
    drawSpinners(dt);
    docTick(dt);
    drawSmall(dt);
    stepParticles(dt);
  }
  if (!pausedUser) stepCam(dt, false);
  sndLevel(pausedUser ? 0 : A.act.v);
  draw(false);
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// ---------------- controls: pause, speed, sound ----------------
