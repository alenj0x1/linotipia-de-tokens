<figcaption class="iso-legend lg"><section class="lg-box"><h3>Código de color</h3><h4>Tipos en la canaleta</h4><ul class="lg-colors"><li style="--h:22;--s:93%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Melocotón</b><span>tu mensaje y los ejemplos escritos por personas</span></div></li><li style="--h:36;--s:53%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Arena</b><span>texto de entrenamiento</span></div></li><li style="--h:152;--s:56%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Menta</b><span>tokens que escribe el modelo</span></div></li><li style="--h:285;--s:38%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Lila apagado</b><span>pensamientos del modelo</span></div></li><li style="--h:205;--s:78%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Celeste</b><span>llamadas a herramientas y sus resultados</span></div></li><li style="--h:8;--s:88%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Coral</b><span>ataques del equipo rojo</span></div></li></ul><h4>Señales de la máquina</h4><ul class="lg-colors"><li style="--h:178;--s:58%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Turquesa</b><span>atención: a qué tokens mira cada capa</span></div></li><li style="--h:335;--s:78%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Rosa</b><span>pesos: las perillas de cada capa</span></div></li><li style="--h:46;--s:96%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Amarillo</b><span>probabilidades: barras y ruleta</span></div></li><li style="--h:8;--s:88%"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Coral</b><span>el error, la pérdida y la recompensa</span></div></li><li style="--h:0;--s:0%" data-k="lit"><svg viewBox="0 0 22 20" aria-hidden="true"><path class="t" d="M11 2 20 6.5 11 11 2 6.5Z"/><path class="l" d="M2 6.5 11 11V18L2 13.5Z"/><path class="r" d="M20 6.5 11 11V18L20 13.5Z"/></svg><div><b>Contorno oscuro</b><span>la pieza que trabaja en este instante</span></div></li></ul></section><section class="lg-box lg-cast"><h3>Reparto: cada pieza y lo que representa</h3><details style="--c:#f1e3cc"><summary><span class="n">1</span>Datos<span class="q">De dónde sale el texto</span></summary><dl>
<dt>Cajas de fuentes</dt><dd>Cada una es un origen de texto: web pública, libros y artículos, código, datos con licencia y datos sintéticos.</dd>
<dt>Embudo y tres cribas</dt><dd>Los filtros: calidad (amarilla), duplicados (celeste) y privacidad y seguridad (coral).</dd>
<dt>Cubo</dt><dd>Lo descartado. Suele ser una parte grande de lo recolectado.</dd>
<dt>Tolva y hojas</dt><dd>El texto limpio, ya cortado en tokens y barajado, listo para entrenar.</dd></dl></details><details style="--c:#fde0cc"><summary><span class="n">2</span>Preentrenar<span class="q">Aprender a predecir</span></summary><dl>
<dt>Canaleta de 12 casillas</dt><dd>La ventana de contexto: cada tipo metálico es un token.</dd>
<dt>Torre de 6 bandejas</dt><dd>Las capas del transformer. Cada una tiene una zona de atención y otra de red neuronal.</dd>
<dt>Elevador y cuentas</dt><dd>El vector del token que se está procesando, subiendo de capa en capa.</dd>
<dt>Ruleta (modo entrenamiento)</dt><dd>No sortea: señala la palabra real, y su porción es la probabilidad que el modelo le daba.</dd>
<dt>Panel, aguja y gráfica</dt><dd>La pérdida de cada ejemplo y su curva a lo largo del entrenamiento.</dd>
<dt>Perillas y arcos coral</dt><dd>Los pesos y el gradiente: cuánto y hacia dónde gira cada uno.</dd>
<dt>Contador y cinco luces</dt><dd>Tokens leídos y habilidades que van apareciendo (ilustrativo).</dd></dl></details><details style="--c:#fbd7e5"><summary><span class="n">3</span>Ajustar<span class="q">Convertirse en asistente</span></summary><dl>
<dt>Teclado</dt><dd>Personas escribiendo respuestas ejemplares (ajuste supervisado).</dd>
<dt>Botones A/B</dt><dd>Votos de preferencia entre dos respuestas.</dd>
<dt>Libro y balanza</dt><dd>El juez o modelo de recompensa, guiado por principios escritos (IA constitucional).</dd>
<dt>Barras amarillas</dt><dd>Cómo cambian las probabilidades antes y después del aprendizaje por refuerzo.</dd></dl></details><details style="--c:#d5f2e2"><summary><span class="n">4</span>Evaluar<span class="q">Comprobar antes de publicar</span></summary><dl>
<dt>Banco de pruebas</dt><dd>Exámenes con respuestas conocidas. La fila superior son pruebas de capacidad; la inferior, ataques del equipo rojo.</dd>
<dt>Tipos coral</dt><dd>Peticiones dañinas o tramposas, escritas a propósito.</dd>
<dt>Luz de publicación</dt><dd>La decisión de lanzar, tras evaluar capacidades de riesgo.</dd></dl></details><details style="--c:#e6defb"><summary><span class="n">5</span>Responder<span class="q">Qué pasa al escribirle</span></summary><dl>
<dt>Tarjeta de instrucciones</dt><dd>El mensaje de sistema que precede siempre a tu texto.</dd>
<dt>Guillotina</dt><dd>El tokenizador: corta el texto en palabras o trozos de palabra.</dd>
<dt>Estantería lila</dt><dd>La tabla de vectores (embeddings): una varilla de números por token.</dd>
<dt>Agujas turquesa</dt><dd>La atención: cuánto mira la posición actual a cada token anterior.</dd>
<dt>Ruleta</dt><dd>El muestreo del siguiente token según sus probabilidades.</dd>
<dt>Caja de fundición</dt><dd>El token elegido se escribe y entra al contexto.</dd></dl></details><details style="--c:#d6eafb"><summary><span class="n">6</span>Herramientas<span class="q">Actuar con herramientas</span></summary><dl>
<dt>Centralita y clavija</dt><dd>El orquestador: valida la llamada y la conecta con la herramienta.</dd>
<dt>Armario y cuatro trampillas</dt><dd>Buscar en la web, ejecutar código, leer archivos y usar un ordenador.</dd>
<dt>Motor y ventilador</dt><dd>El esfuerzo de cálculo: bajan de vueltas mientras el modelo sólo espera.</dd></dl></details></section><p class="lg-note"><b>Ilustración simplificada y honesta.</b> Seis bandejas representan las decenas de capas de un transformer, y una sola aguja por token resume las muchas cabezas de atención que trabajan en paralelo. Doce casillas representan una ventana de contexto que en un modelo real tiene cientos de miles de tokens. En el capítulo 1, el color de cada bolita indica su fuente (web, libros, código, otros), no este código. Las probabilidades, pérdidas y recompensas son ejemplos calculados aquí mismo con softmax. Anthropic no publica la arquitectura interna de sus modelos; la figura muestra cómo funcionan en general los grandes modelos de lenguaje.</p></figcaption>
